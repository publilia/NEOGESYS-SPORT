version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neogesys-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: neogesys_sport
      POSTGRES_USER: neogesys
      POSTGRES_PASSWORD: neogesys_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neogesys -d neogesys_sport"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neogesys-network

  redis:
    image: redis:7-alpine
    container_name: neogesys-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neogesys-network

  minio:
    image: minio/minio:latest
    container_name: neogesys-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio_dev
      MINIO_ROOT_PASSWORD: minio_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neogesys-network

  typesense:
    image: typesense/typesense:27.1
    container_name: neogesys-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: typesense_dev_key
      TYPESENSE_DATA_DIR: /data
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neogesys-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  typesense_data:

networks:
  neogesys-network:
    driver: bridge
