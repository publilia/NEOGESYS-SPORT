<!DOCTYPE html>
<html lang="it" data-palette="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEOGESYS SPORT · Super Admin Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function () {
    const theme = localStorage.getItem('theme') || 'system';
    const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (isDark) document.documentElement.classList.add('dark');
    const palette = localStorage.getItem('palette') || 'default';
    document.documentElement.setAttribute('data-palette', palette);
  })();
</script>
<style>
/* ============================== PALETTE SYSTEM ============================== */
:root,
[data-palette="default"] {
  --background: 0 0% 100%;
  --foreground: 222 47% 11%;
  --card: 0 0% 100%;
  --card-foreground: 222 47% 11%;
  --popover: 0 0% 100%;
  --popover-foreground: 222 47% 11%;
  --primary: 221 83% 53%;
  --primary-foreground: 210 40% 98%;
  --secondary: 210 40% 96%;
  --secondary-foreground: 222 47% 11%;
  --muted: 210 40% 96%;
  --muted-foreground: 215 16% 47%;
  --accent: 210 40% 94%;
  --accent-foreground: 222 47% 11%;
  --destructive: 0 84% 60%;
  --destructive-foreground: 0 0% 98%;
  --success: 142 71% 45%;
  --warning: 38 92% 50%;
  --border: 214 32% 91%;
  --input: 214 32% 91%;
  --ring: 221 83% 53%;
}
.dark,
.dark[data-palette="default"] {
  --background: 222 47% 7%;
  --foreground: 210 40% 98%;
  --card: 222 47% 10%;
  --card-foreground: 210 40% 98%;
  --popover: 222 47% 10%;
  --popover-foreground: 210 40% 98%;
  --primary: 217 91% 60%;
  --primary-foreground: 222 47% 11%;
  --secondary: 217 33% 17%;
  --secondary-foreground: 210 40% 98%;
  --muted: 217 33% 17%;
  --muted-foreground: 215 20% 65%;
  --accent: 217 33% 20%;
  --accent-foreground: 210 40% 98%;
  --destructive: 0 63% 50%;
  --destructive-foreground: 0 0% 98%;
  --success: 142 71% 45%;
  --warning: 38 92% 50%;
  --border: 217 33% 20%;
  --input: 217 33% 20%;
  --ring: 217 91% 60%;
}

[data-palette="ocean"] {
  --primary: 189 94% 43%;
  --primary-foreground: 0 0% 100%;
  --secondary: 180 40% 94%;
  --accent: 180 50% 90%;
  --ring: 189 94% 43%;
}
.dark[data-palette="ocean"] {
  --primary: 188 86% 53%;
  --primary-foreground: 222 47% 11%;
  --background: 200 47% 7%;
  --card: 200 47% 10%;
}

[data-palette="forest"] {
  --primary: 142 71% 35%;
  --primary-foreground: 0 0% 100%;
  --secondary: 60 20% 94%;
  --accent: 90 30% 90%;
  --ring: 142 71% 35%;
}
.dark[data-palette="forest"] {
  --primary: 142 61% 45%;
  --background: 120 20% 7%;
  --card: 120 20% 10%;
}

[data-palette="sunset"] {
  --primary: 24 95% 53%;
  --primary-foreground: 0 0% 100%;
  --secondary: 340 40% 95%;
  --accent: 340 50% 92%;
  --ring: 24 95% 53%;
}
.dark[data-palette="sunset"] {
  --primary: 24 95% 58%;
  --background: 24 30% 8%;
  --card: 24 30% 12%;
}

[data-palette="monochrome"] {
  --primary: 0 0% 20%;
  --primary-foreground: 0 0% 98%;
  --secondary: 0 0% 94%;
  --accent: 0 0% 90%;
  --ring: 0 0% 40%;
}
.dark[data-palette="monochrome"] {
  --primary: 0 0% 90%;
  --primary-foreground: 0 0% 10%;
  --background: 0 0% 7%;
  --card: 0 0% 10%;
}

[data-palette="vibrant"] {
  --primary: 271 91% 65%;
  --primary-foreground: 0 0% 100%;
  --secondary: 190 70% 94%;
  --accent: 190 80% 90%;
  --ring: 271 91% 65%;
}
.dark[data-palette="vibrant"] {
  --primary: 271 91% 70%;
  --background: 260 30% 8%;
  --card: 260 30% 12%;
}

[data-palette="corporate"] {
  --primary: 217 90% 20%;
  --primary-foreground: 45 100% 70%;
  --secondary: 45 80% 94%;
  --accent: 45 70% 90%;
  --ring: 45 80% 50%;
}
.dark[data-palette="corporate"] {
  --primary: 45 80% 60%;
  --primary-foreground: 217 90% 15%;
  --background: 217 50% 8%;
  --card: 217 50% 12%;
}

[data-palette="sport"] {
  --primary: 0 84% 50%;
  --primary-foreground: 0 0% 100%;
  --secondary: 0 0% 94%;
  --accent: 0 0% 90%;
  --ring: 0 84% 50%;
}
.dark[data-palette="sport"] {
  --primary: 0 84% 58%;
  --background: 0 0% 8%;
  --card: 0 0% 12%;
}

/* ============================== BASE STYLES ============================== */
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 14px;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
  transition: background-color 200ms ease, color 200ms ease;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body { min-height: 100vh; overflow-x: hidden; }

button { font-family: inherit; font-size: inherit; cursor: pointer; background: none; border: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: hsl(var(--muted)); }
::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground) / 0.5); }

/* Utilities */
.hidden { display: none !important; }
.flex { display: flex; }
.grid { display: grid; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 0.5rem; }
.gap-3 { gap: 0.75rem; }
.gap-4 { gap: 1rem; }

/* Button */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  padding: 0.5rem 1rem; border-radius: 0.5rem; font-weight: 500; font-size: 0.875rem;
  transition: all 150ms ease; white-space: nowrap;
}
.btn:focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; }
.btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.btn-primary:hover { background: hsl(var(--primary) / 0.9); }
.btn-secondary { background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground)); }
.btn-secondary:hover { background: hsl(var(--secondary) / 0.8); }
.btn-outline { border: 1px solid hsl(var(--border)); }
.btn-outline:hover { background: hsl(var(--accent)); }
.btn-ghost:hover { background: hsl(var(--accent)); }
.btn-icon { padding: 0.5rem; width: 2.25rem; height: 2.25rem; }
.btn-sm { padding: 0.375rem 0.75rem; font-size: 0.8125rem; }

/* Badge */
.badge {
  display: inline-flex; align-items: center; gap: 0.25rem;
  padding: 0.125rem 0.625rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500;
  background: hsl(var(--secondary)); color: hsl(var(--secondary-foreground));
}
.badge-success { background: hsl(var(--success) / 0.15); color: hsl(var(--success)); }
.badge-warning { background: hsl(var(--warning) / 0.15); color: hsl(var(--warning)); }
.badge-destructive { background: hsl(var(--destructive) / 0.15); color: hsl(var(--destructive)); }
.badge-primary { background: hsl(var(--primary) / 0.15); color: hsl(var(--primary)); }

/* Card */
.card {
  background: hsl(var(--card)); color: hsl(var(--card-foreground));
  border: 1px solid hsl(var(--border)); border-radius: 0.75rem;
}
.card-header { padding: 1.25rem 1.25rem 0.75rem; }
.card-body { padding: 1.25rem; }
.card-title { font-size: 1rem; font-weight: 600; }
.card-desc { font-size: 0.8125rem; color: hsl(var(--muted-foreground)); margin-top: 0.25rem; }

/* Inputs */
.input, .select {
  width: 100%; padding: 0.5rem 0.75rem; border-radius: 0.5rem;
  border: 1px solid hsl(var(--input)); background: hsl(var(--background));
  transition: border-color 150ms;
}
.input:focus, .select:focus { outline: none; border-color: hsl(var(--ring)); box-shadow: 0 0 0 3px hsl(var(--ring) / 0.1); }

/* Icon */
.icon { width: 1rem; height: 1rem; flex-shrink: 0; }
.icon-sm { width: 0.875rem; height: 0.875rem; }
.icon-lg { width: 1.25rem; height: 1.25rem; }
.icon-xl { width: 1.5rem; height: 1.5rem; }

/* ============================== LAYOUT ============================== */
.app-shell { min-height: 100vh; display: flex; flex-direction: column; }

/* Header */
.app-header {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 1rem;
  height: 3.5rem; padding: 0 1rem;
  background: hsl(var(--background) / 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid hsl(var(--border));
}
.header-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
.logo {
  display: flex; align-items: center; gap: 0.5rem;
  font-weight: 800; font-size: 0.875rem; letter-spacing: -0.02em;
}
.logo-mark {
  width: 2rem; height: 2rem; border-radius: 0.5rem;
  background: #13102A; /* notte cosmica — fa brillare il disco viola/magenta */
  display: grid; place-items: center;
  overflow: hidden;
}
.logo-mark > svg { width: 100%; height: 100%; display: block; }

.logo-horizontal { gap: 0.5rem; }
.logo-horizontal-wrap {
  display: inline-flex; align-items: center; justify-content: center;
  height: 2rem; padding: 0 0.625rem; border-radius: 0.5rem;
  background: #13102A; color: #FFF6D9;
  box-shadow: 0 0 0 1px rgba(139, 63, 229, 0.25), 0 0 18px rgba(237, 63, 158, 0.12);
  overflow: hidden;
}
.logo-horizontal-wrap > svg { height: 1.25rem; width: auto; display: block; }
.logo-sector {
  display: inline-block; padding: 0.125rem 0.5rem; border-radius: 9999px;
  font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.08em;
  text-transform: uppercase; color: #FFF6D9;
  background: linear-gradient(135deg, #8B3FE5 0%, #ED3F9E 100%);
  box-shadow: 0 0 12px rgba(237, 63, 158, 0.35);
  white-space: nowrap;
}
.tenant-name { color: hsl(var(--muted-foreground)); font-size: 0.75rem; font-weight: 500; }
.tenant-name::before { content: "•"; margin-right: 0.5rem; opacity: 0.5; }

.header-search {
  flex: 1; max-width: 32rem; margin: 0 auto;
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 0.75rem; border-radius: 0.5rem;
  background: hsl(var(--muted));
  color: hsl(var(--muted-foreground));
  font-size: 0.8125rem;
  cursor: text; transition: all 150ms;
}
.header-search:hover { background: hsl(var(--accent)); }
.header-search kbd {
  margin-left: auto; padding: 0.125rem 0.375rem;
  background: hsl(var(--background)); border: 1px solid hsl(var(--border));
  border-radius: 0.25rem; font-size: 0.6875rem; font-family: inherit;
}

.header-right { display: flex; align-items: center; gap: 0.25rem; }
.header-right .btn-icon { position: relative; color: hsl(var(--muted-foreground)); }
.header-right .btn-icon:hover { color: hsl(var(--foreground)); }
.notification-dot {
  position: absolute; top: 0.375rem; right: 0.375rem;
  width: 1rem; height: 1rem; border-radius: 50%;
  background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground));
  font-size: 0.625rem; font-weight: 600;
  display: grid; place-items: center;
}

.avatar {
  width: 2rem; height: 2rem; border-radius: 50%;
  background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary) / 0.6));
  color: hsl(var(--primary-foreground));
  display: grid; place-items: center;
  font-weight: 600; font-size: 0.75rem;
}

/* Main container */
.app-body { display: flex; flex: 1; min-height: 0; }

/* Sidebar */
.app-sidebar {
  width: 240px; flex-shrink: 0;
  background: hsl(var(--card));
  border-right: 1px solid hsl(var(--border));
  display: flex; flex-direction: column;
  transition: width 200ms ease;
  overflow: hidden;
}
.app-sidebar.collapsed { width: 64px; }
.sidebar-nav { padding: 0.75rem 0.5rem; display: flex; flex-direction: column; gap: 0.125rem; overflow-y: auto; }
.nav-group-label {
  padding: 0.75rem 0.75rem 0.25rem;
  font-size: 0.6875rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: hsl(var(--muted-foreground));
}
.collapsed .nav-group-label { display: none; }
.nav-item {
  display: flex; align-items: center; gap: 0.75rem;
  padding: 0.5rem 0.75rem; border-radius: 0.5rem;
  color: hsl(var(--muted-foreground));
  font-weight: 500; font-size: 0.8125rem;
  cursor: pointer; transition: all 150ms; width: 100%; text-align: left;
  white-space: nowrap;
}
.nav-item:hover { background: hsl(var(--accent)); color: hsl(var(--foreground)); }
.nav-item.active {
  background: hsl(var(--primary) / 0.1); color: hsl(var(--primary));
}
.nav-item.active .icon { color: hsl(var(--primary)); }
.nav-item .icon { width: 1.125rem; height: 1.125rem; }
.collapsed .nav-item { justify-content: center; padding: 0.625rem; }
.collapsed .nav-item .nav-label { display: none; }
.nav-badge {
  margin-left: auto; background: hsl(var(--destructive)); color: hsl(var(--destructive-foreground));
  padding: 0.0625rem 0.375rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 600;
}
.collapsed .nav-badge { display: none; }

/* Topbar mode */
.app-topbar {
  display: none; padding: 0 1rem;
  background: hsl(var(--card)); border-bottom: 1px solid hsl(var(--border));
}
.topbar-nav { display: flex; gap: 0.25rem; overflow-x: auto; }
.topbar-nav .nav-item { flex-direction: row; padding: 0.875rem 1rem; border-radius: 0; position: relative; }
.topbar-nav .nav-item.active { background: transparent; }
.topbar-nav .nav-item.active::after {
  content: ""; position: absolute; bottom: 0; left: 0.5rem; right: 0.5rem; height: 2px;
  background: hsl(var(--primary));
}

body[data-layout="topbar"] .app-sidebar { display: none; }
body[data-layout="topbar"] .app-topbar { display: block; }

/* Main content */
.app-main { flex: 1; overflow-y: auto; padding: 1.5rem; }
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap;
}
.page-title { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
.page-subtitle { color: hsl(var(--muted-foreground)); font-size: 0.875rem; margin-top: 0.25rem; }
.page-actions { display: flex; gap: 0.5rem; }

/* Responsive */
@media (max-width: 1024px) {
  .app-sidebar { position: fixed; top: 3.5rem; bottom: 0; left: 0; z-index: 30;
    transform: translateX(-100%); transition: transform 250ms; width: 240px !important; }
  .app-sidebar.mobile-open { transform: translateX(0); box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
}
@media (max-width: 768px) {
  .header-search { display: none; }
  .tenant-name { display: none; }
  .app-main { padding: 1rem; }
  .page-title { font-size: 1.25rem; }
}

/* ============================== DASHBOARD ============================== */
.stat-grid {
  display: grid; gap: 1rem; margin-bottom: 1.5rem;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.stat-card { padding: 1.25rem; }
.stat-card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
.stat-card-title { font-size: 0.8125rem; color: hsl(var(--muted-foreground)); font-weight: 500; }
.stat-icon { width: 2rem; height: 2rem; border-radius: 0.5rem; display: grid; place-items: center; }
.stat-value { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.stat-trend { display: flex; align-items: center; gap: 0.25rem; font-size: 0.75rem; margin-top: 0.5rem; }
.stat-trend.up { color: hsl(var(--success)); }
.stat-trend.down { color: hsl(var(--destructive)); }
.stat-trend.warn { color: hsl(var(--warning)); }

.dash-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; }
@media (max-width: 1024px) { .dash-grid { grid-template-columns: 1fr; } }

/* Chart simple bar */
.chart-bars { display: flex; align-items: flex-end; gap: 0.5rem; height: 200px; padding: 1rem 0; }
.chart-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.chart-bar-fill {
  width: 100%; background: linear-gradient(180deg, hsl(var(--primary)), hsl(var(--primary) / 0.6));
  border-radius: 0.25rem 0.25rem 0 0; transition: height 400ms ease;
  min-height: 4px;
}
.chart-bar-label { font-size: 0.6875rem; color: hsl(var(--muted-foreground)); }
.chart-bar-value { font-size: 0.6875rem; font-weight: 600; }

/* Alerts */
.alert-list { display: flex; flex-direction: column; gap: 0.5rem; }
.alert-item {
  display: flex; align-items: flex-start; gap: 0.75rem;
  padding: 0.75rem; border-radius: 0.5rem;
  background: hsl(var(--muted));
  border-left: 3px solid hsl(var(--warning));
  font-size: 0.8125rem;
}
.alert-item.warn { border-left-color: hsl(var(--warning)); }
.alert-item.danger { border-left-color: hsl(var(--destructive)); }
.alert-item.info { border-left-color: hsl(var(--primary)); }
.alert-icon {
  width: 1.75rem; height: 1.75rem; border-radius: 0.5rem;
  background: hsl(var(--warning) / 0.15); color: hsl(var(--warning));
  display: grid; place-items: center; flex-shrink: 0;
}
.alert-item.danger .alert-icon { background: hsl(var(--destructive) / 0.15); color: hsl(var(--destructive)); }
.alert-item.info .alert-icon { background: hsl(var(--primary) / 0.15); color: hsl(var(--primary)); }
.alert-title { font-weight: 600; }
.alert-desc { color: hsl(var(--muted-foreground)); font-size: 0.75rem; margin-top: 0.125rem; }

/* Event cards */
.event-list { display: flex; flex-direction: column; gap: 0.5rem; }
.event-item { display: flex; gap: 0.75rem; padding: 0.75rem; border-radius: 0.5rem; transition: background 150ms; cursor: pointer; }
.event-item:hover { background: hsl(var(--muted)); }
.event-date {
  width: 3rem; height: 3rem; border-radius: 0.5rem;
  background: hsl(var(--primary) / 0.1); color: hsl(var(--primary));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.event-date-day { font-size: 1.125rem; font-weight: 700; line-height: 1; }
.event-date-month { font-size: 0.625rem; font-weight: 600; text-transform: uppercase; }
.event-title { font-weight: 600; font-size: 0.875rem; }
.event-meta { font-size: 0.75rem; color: hsl(var(--muted-foreground)); margin-top: 0.125rem; display: flex; gap: 0.75rem; }

/* ============================== TABLE ============================== */
.table-container { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.table thead th {
  padding: 0.75rem 1rem; text-align: left; font-weight: 600; font-size: 0.75rem;
  color: hsl(var(--muted-foreground)); text-transform: uppercase; letter-spacing: 0.05em;
  background: hsl(var(--muted) / 0.5);
  border-bottom: 1px solid hsl(var(--border));
  position: sticky; top: 0;
}
.table tbody td { padding: 0.875rem 1rem; border-bottom: 1px solid hsl(var(--border)); }
.table tbody tr:hover { background: hsl(var(--muted) / 0.5); }
.table tbody tr:last-child td { border-bottom: none; }
.table-actions { display: flex; gap: 0.25rem; }
.table-action { padding: 0.375rem; border-radius: 0.375rem; color: hsl(var(--muted-foreground)); }
.table-action:hover { background: hsl(var(--accent)); color: hsl(var(--foreground)); }

.filters-bar {
  display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;
}
.filters-bar .input { max-width: 20rem; }
.filters-bar .select { max-width: 12rem; }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.75rem 1rem; border-top: 1px solid hsl(var(--border));
  font-size: 0.8125rem; color: hsl(var(--muted-foreground));
}

/* ============================== COURSES GRID ============================== */
.course-grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.course-card { padding: 1.25rem; cursor: pointer; transition: all 200ms; }
.course-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px hsl(var(--foreground) / 0.08); }
.course-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
.course-title { font-weight: 700; font-size: 1rem; }
.course-desc { font-size: 0.75rem; color: hsl(var(--muted-foreground)); margin: 0.25rem 0 0.75rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
.course-desc span { display: inline-flex; align-items: center; gap: 0.25rem; }
.capacity-bar { height: 0.5rem; background: hsl(var(--muted)); border-radius: 9999px; overflow: hidden; margin: 0.75rem 0 0.375rem; }
.capacity-fill { height: 100%; border-radius: 9999px; transition: width 300ms; }
.capacity-fill.low { background: hsl(var(--success)); }
.capacity-fill.mid { background: hsl(var(--warning)); }
.capacity-fill.high { background: hsl(var(--destructive)); }
.capacity-text { font-size: 0.75rem; color: hsl(var(--muted-foreground)); display: flex; justify-content: space-between; }

/* ============================== CALENDAR ============================== */
.calendar-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
.calendar-grid {

/* ============================== ACTIONS ============================== */
function navigate(page) {
  STATE.page = page;
  localStorage.setItem('page', page);
  STATE.mobileOpen = false;
  render();
  document.getElementById('main-content')?.scrollTo(0, 0);
}

function toggleSidebar() {
  if (window.innerWidth <= 1024) {
    STATE.mobileOpen = !STATE.mobileOpen;
  } else {
    STATE.sidebarCollapsed = !STATE.sidebarCollapsed;
    localStorage.setItem('sidebarCollapsed', STATE.sidebarCollapsed);
  }
  render();
}

function toggleMobile() { STATE.mobileOpen = !STATE.mobileOpen; render(); }
function togglePalette() { STATE.paletteOpen = !STATE.paletteOpen; STATE.userMenuOpen = false; render(); }
function toggleUserMenu() { STATE.userMenuOpen = !STATE.userMenuOpen; STATE.paletteOpen = false; render(); }

function setPalette(id) {
  STATE.palette = id;
  document.documentElement.setAttribute('data-palette', id);
  localStorage.setItem('palette', id);
  STATE.paletteOpen = false;
  render();
}

function cycleTheme() {
  const order = ['light', 'dark', 'system'];
  const idx = order.indexOf(STATE.theme);
  STATE.theme = order[(idx + 1) % order.length];
  localStorage.setItem('theme', STATE.theme);
  applyTheme();
  render();
}

function applyTheme() {
  const isDark = STATE.theme === 'dark' || (STATE.theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.classList.toggle('dark', isDark);
}

function setLayout(mode) {
  STATE.layout = mode;
  localStorage.setItem('layout', mode);
  render();
}

function setTheme(id) {
  STATE.theme = id;
  localStorage.setItem('theme', id);
  applyTheme();
  render();
}

function openCmdk() { STATE.cmdkOpen = true; render(); setTimeout(() => document.getElementById('cmdk-input')?.focus(), 10); }
function closeCmdk() { STATE.cmdkOpen = false; render(); }
function toggleAI() { STATE.aiOpen = !STATE.aiOpen; render(); }

/* Keyboard shortcuts */
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmdk(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); toggleAI(); }
  if (e.key === 'Escape') {
    if (STATE.cmdkOpen) closeCmdk();
    else if (STATE.aiOpen) toggleAI();
    else if (STATE.paletteOpen || STATE.userMenuOpen) { STATE.paletteOpen = false; STATE.userMenuOpen = false; render(); }
  }
});

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (STATE.theme === 'system') applyTheme();
});

function pageCalendario() {
  const d = STATE.calendarMonth;
  const year = d.getFullYear();
  const month = d.getMonth();
  const monthNames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDow = (firstDay.getDay() + 6) % 7;
  const daysInMonth = lastDay.getDate();
  const prevMonthDays = new Date(year, month, 0).getDate();
  const today = new Date(2026, 3, 17);
  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) cells.push({ n: prevMonthDays - i, other: true });
  for (let i = 1; i <= daysInMonth; i++) cells.push({ n: i, other: false, today: year === today.getFullYear() && month === today.getMonth() && i === today.getDate() });
  while (cells.length % 7 !== 0) cells.push({ n: cells.length - daysInMonth - startDow + 1, other: true });
  const eventsByDay = { 3: [{ t: 'Atletica', c: 'corso' }], 4: [{ t: 'Nuoto', c: 'corso' }], 5: [{ t: 'Pallavolo', c: 'corso' }], 8: [{ t: 'Yoga', c: 'corso' }, { t: 'Calcetto', c: 'corso' }], 10: [{ t: 'Karate', c: 'corso' }], 15: [{ t: 'Pallavolo', c: 'corso' }, { t: 'Yoga', c: 'corso' }], 17: [{ t: 'Atletica', c: 'corso' }, { t: 'Nuoto', c: 'corso' }], 20: [{ t: 'Torneo Pallavolo', c: 'evento' }], 22: [{ t: 'Yoga', c: 'corso' }], 25: [{ t: 'Saggio Yoga', c: 'evento' }], 28: [{ t: 'Nuoto', c: 'corso' }] };
  return `
    <div class="page-header">
      <div>
        <h1 class="page-title">Calendario</h1>
        <p class="page-subtitle">Corsi ed eventi · Vista mensile</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-outline btn-sm">Settimana</button>
        <button class="btn btn-primary btn-sm">Mese</button>
        <button class="btn btn-outline btn-sm"><i data-lucide="calendar-plus" class="icon"></i> Nuovo Evento</button>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="calendar-nav">
          <button class="btn btn-ghost btn-icon" onclick="calMonth(-1)"><i data-lucide="chevron-left"></i></button>
          <div style="font-size: 1.125rem; font-weight: 600;">${monthNames[month]} ${year}</div>
          <button class="btn btn-ghost btn-icon" onclick="calMonth(1)"><i data-lucide="chevron-right"></i></button>
        </div>
        <div class="calendar-grid">
          ${['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d => `<div class="calendar-dow">${d}</div>`).join('')}
          ${cells.map(c => {
            const ev = !c.other && eventsByDay[c.n] ? eventsByDay[c.n] : [];
            return `
              <div class="calendar-day ${c.other ? 'other-month' : ''} ${c.today ? 'today' : ''}">
                <span class="day-num">${c.n}</span>
                ${ev.slice(0, 3).map(e => `<div class="cal-event ${e.c}">${e.t}</div>`).join('')}
                ${ev.length > 3 ? `<div style="font-size: 0.6875rem; color: hsl(var(--muted-foreground));">+${ev.length - 3} altri</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
        <div style="display:flex; gap:1rem; margin-top:1rem; font-size:0.75rem;">
          <span style="display:inline-flex; align-items:center; gap:0.375rem;"><span style="width:0.75rem; height:0.75rem; border-radius:0.25rem; background:hsl(var(--primary) / 0.5);"></span> Corso</span>

        </div>
      </div>
    </div>
  `;
}

function renderCmdk() {
  const q = (STATE.cmdkQuery || '').toLowerCase();
  const navItems = NAV.filter(n => !q || n.label.toLowerCase().includes(q));
  const sociItems = SOCI.filter(s => !q || (s.n + ' ' + s.c).toLowerCase().includes(q)).slice(0, 5);
  const actions = [
    { id: 'ai', label: 'Apri AI Assistente (⌘J)', icon: 'sparkles', action: 'toggleAI()' },
    { id: 'theme', label: 'Cambia tema', icon: 'moon', action: 'cycleTheme()' },
    { id: 'palette', label: 'Cambia palette colori', icon: 'palette', action: 'togglePalette()' },
    { id: 'newSocio', label: 'Nuovo socio', icon: 'user-plus', action: "alert('Form nuovo socio')" },
    { id: 'newQuota', label: 'Emetti quota', icon: 'credit-card', action: "navigate('quote')" },
  ].filter(a => !q || a.label.toLowerCase().includes(q));

  return `
    <div class="backdrop" onclick="closeCmdk()">
      <div class="cmdk-modal anim-scale" onclick="event.stopPropagation()">
        <div class="cmdk-header">
          <i data-lucide="search" class="icon-lg" style="color: hsl(var(--muted-foreground));"></i>
          <input id="cmdk-input" type="text" placeholder="Cerca soci, corsi, quote, azioni..." value="${STATE.cmdkQuery || ''}" oninput="STATE.cmdkQuery = this.value; renderCmdkResults();" autocomplete="off">
          <kbd>ESC</kbd>
        </div>
        <div id="cmdk-results" class="cmdk-results">
          ${cmdkResultsHTML(navItems, sociItems, actions)}
        </div>
        <div class="cmdk-footer">
          <div style="display: flex; gap: 1rem;">
            <span><kbd>↑↓</kbd> Naviga</span>
            <span><kbd>↵</kbd> Seleziona</span>
            <span><kbd>ESC</kbd> Chiudi</span>
          </div>
          <span><i data-lucide="sparkles" class="icon-sm" style="color: hsl(var(--primary));"></i> AI: <kbd>⌘J</kbd></span>
        </div>
      </div>
    </div>
  `;
}

function cmdkResultsHTML(navItems, sociItems, actions) {
  if (!navItems.length && !sociItems.length && !actions.length) {
    return `<div style="padding: 3rem 1rem; text-align: center; color: hsl(var(--muted-foreground));">
      <i data-lucide="search-x" style="width: 2rem; height: 2rem; margin: 0 auto 0.5rem; display: block;"></i>
      <div>Nessun risultato</div>
    </div>`;
  }
  let html = '';
  if (navItems.length) {
    html += `<div class="cmdk-group">
      <div class="cmdk-group-label">Navigazione</div>
      ${navItems.map(n => `
        <button class="cmdk-item" onclick="closeCmdk(); navigate('${n.id}')">
          <i data-lucide="${n.icon}" class="icon"></i>
          <span>${n.label}</span>
          ${n.badge ? `<span class="nav-badge" style="margin-left:auto;">${n.badge}</span>` : ''}
        </button>
      `).join('')}
    </div>`;
  }
  if (sociItems.length) {
    html += `<div class="cmdk-group">
      <div class="cmdk-group-label">Soci</div>
      ${sociItems.map(s => `
        <button class="cmdk-item" onclick="closeCmdk(); navigate('soci')">
          <div class="avatar" style="width: 1.5rem; height: 1.5rem; font-size: 0.625rem;">${s.n[0]}${s.c[0]}</div>
          <span>${s.n} ${s.c}</span>
          <span style="margin-left: auto; font-size: 0.75rem; color: hsl(var(--muted-foreground));">${s.d}</span>
        </button>
      `).join('')}
    </div>`;
  }
  if (actions.length) {
    html += `<div class="cmdk-group">
      <div class="cmdk-group-label">Azioni</div>
      ${actions.map(a => `
        <button class="cmdk-item" onclick="closeCmdk(); ${a.action}">
          <i data-lucide="${a.icon}" class="icon"></i>
          <span>${a.label}</span>
        </button>
      `).join('')}
    </div>`;
  }
  return html;
}

function renderCmdkResults() {
  const q = (STATE.cmdkQuery || '').toLowerCase();
  const navItems = NAV.filter(n => !q || n.label.toLowerCase().includes(q));
  const sociItems = SOCI.filter(s => !q || (s.n + ' ' + s.c).toLowerCase().includes(q)).slice(0, 5);
  const actions = [
    { id: 'ai', label: 'Apri AI Assistente (⌘J)', icon: 'sparkles', action: 'toggleAI()' },
    { id: 'theme', label: 'Cambia tema', icon: 'moon', action: 'cycleTheme()' },
    { id: 'palette', label: 'Cambia palette colori', icon: 'palette', action: 'togglePalette()' },
    { id: 'newSocio', label: 'Nuovo socio', icon: 'user-plus', action: "alert('Form nuovo socio')" },
    { id: 'newQuota', label: 'Emetti quota', icon: 'credit-card', action: "navigate('quote')" },
  ].filter(a => !q || a.label.toLowerCase().includes(q));
  const results = document.getElementById('cmdk-results');
  if (results) {
    results.innerHTML = cmdkResultsHTML(navItems, sociItems, actions);
    if (window.lucide) lucide.createIcons();
  }
}
